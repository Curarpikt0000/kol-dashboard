<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOL Research Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d2e;
    --card2: #232640;
    --border: #2e3154;
    --text: #e2e8f0;
    --muted: #8892a4;
    --bull: #22c55e;
    --bull-bg: rgba(34,197,94,0.12);
    --bear: #ef4444;
    --bear-bg: rgba(239,68,68,0.12);
    --neutral: #94a3b8;
    --accent: #6366f1;
    --accent2: #a78bfa;
    --gold: #f59e0b;
    --warning: #f97316;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; min-height: 100vh; }

  /* ── Header ── */
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: .5px; }
  header h1 span { color: var(--accent2); }
  #update-time { font-size: 12px; color: var(--muted); }

  /* ── Layout ── */
  .container { max-width: 1400px; margin: 0 auto; padding: 20px 24px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }

  /* ── Cards ── */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .card-title { font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

  /* ── Filters ── */
  .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
  .filter-bar input, .filter-bar select { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 7px 12px; border-radius: 8px; font-size: 13px; outline: none; }
  .filter-bar input:focus, .filter-bar select:focus { border-color: var(--accent); }
  .filter-bar input { width: 200px; }
  .filter-label { font-size: 12px; color: var(--muted); }

  /* ── Stance Change Banner ── */
  #stance-banner { background: linear-gradient(135deg, rgba(245,158,11,0.12), rgba(239,68,68,0.08)); border: 1px solid rgba(245,158,11,0.3); border-radius: 12px; padding: 16px; margin-bottom: 20px; display: none; }
  #stance-banner h3 { font-size: 14px; color: var(--gold); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .stance-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 13px; }
  .stance-item:last-child { border-bottom: none; }
  .stance-arrow { font-size: 18px; }
  .stance-kol { font-weight: 600; min-width: 140px; }
  .stance-sector { color: var(--muted); font-size: 12px; }
  .tag-bull { background: var(--bull-bg); color: var(--bull); padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
  .tag-bear { background: var(--bear-bg); color: var(--bear); padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
  .tag-neutral { background: rgba(148,163,184,0.12); color: var(--neutral); padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  .tag-sector { background: rgba(99,102,241,0.12); color: var(--accent2); padding: 2px 8px; border-radius: 4px; font-size: 12px; }

  /* ── Sector Radar ── */
  #radar-wrap { position: relative; height: 260px; }

  /* ── Sector Bar ── */
  .sector-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
  .sector-name { width: 130px; color: var(--text); flex-shrink: 0; line-height: 1.3; }
  .sector-bar-wrap { flex: 1; display: flex; align-items: center; gap: 0; height: 10px; position: relative; }
  /* left half (bear) and right half (bull) each take 50% */
  .sb-left  { width: 50%; display: flex; justify-content: flex-end; }
  .sb-right { width: 50%; display: flex; justify-content: flex-start; }
  .sb-center-line { width: 2px; flex-shrink: 0; background: var(--border); height: 14px; border-radius: 1px; }
  .sb-fill { height: 8px; border-radius: 4px; transition: width .4s; min-width: 0; }
  .sector-score { width: 44px; text-align: right; font-weight: 600; font-size: 12px; }
  .sector-count { width: 50px; text-align: right; color: var(--muted); font-size: 12px; }

  /* ── KOL Cards ── */
  #kol-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .kol-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; transition: border-color .2s, transform .15s; cursor: default; }
  .kol-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .kol-card.stance-changed { border-color: var(--gold) !important; }
  .kol-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
  .kol-name { font-weight: 700; font-size: 14px; }
  .kol-meta { font-size: 11px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .sentiment-badge { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .sentiment-dots { display: flex; gap: 3px; }
  /* 修复：所有非活跃点统一灰色，只有活跃点发光 */
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #2e3154; }
  .dot.active-bull { background: var(--bull); box-shadow: 0 0 7px var(--bull); }
  .dot.active-bear { background: var(--bear); box-shadow: 0 0 7px var(--bear); }
  .dot.active-neutral { background: var(--neutral); box-shadow: 0 0 5px var(--neutral); }
  /* Sector 徽章 */
  .sector-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .sb-pm    { background: rgba(245,158,11,0.15); color: #f59e0b; }   /* Precious Metals */
  .sb-macro { background: rgba(99,102,241,0.15); color: #818cf8; }   /* Macro */
  .sb-energy{ background: rgba(249,115,22,0.15); color: #fb923c; }   /* Energy & Commodities */
  .sb-crypto{ background: rgba(168,85,247,0.15); color: #c084fc; }   /* Crypto */
  .sb-eq    { background: rgba(34,197,94,0.12);  color: #4ade80; }   /* Equities */
  .sb-geo   { background: rgba(239,68,68,0.12);  color: #f87171; }   /* Geopolitics */
  .sb-alt   { background: rgba(148,163,184,0.12);color: #94a3b8; }   /* Alternative */
  .sb-ai    { background: rgba(6,182,212,0.12);  color: #22d3ee; }   /* AI & Tech */
  .sb-tech  { background: rgba(16,185,129,0.12); color: #34d399; }   /* Technology */
  .sb-gov   { background: rgba(251,191,36,0.12); color: #fbbf24; }   /* Government Debt */
  .sb-mine  { background: rgba(139,92,246,0.12); color: #a78bfa; }   /* Mining */
  .sb-multi { background: rgba(236,72,153,0.12); color: #f472b6; }   /* Multi-Asset */
  /* Date range picker */
  #custom-date-range { display:none; align-items:center; gap:6px; }
  #custom-date-range input[type=date] { background:var(--card); border:1px solid var(--border); color:var(--text); padding:7px 10px; border-radius:8px; font-size:13px; outline:none; }
  #custom-date-range input[type=date]:focus { border-color:var(--accent); }
  .kol-comments { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .kol-bull-bear { font-size: 12px; color: var(--text); margin-bottom: 6px; }
  .kol-footer { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .trend-up { color: var(--bull); }
  .trend-down { color: var(--bear); }

  /* ── Ticker Heatmap ── */
  .ticker-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; }
  .ticker-sym { font-weight: 700; width: 46px; color: var(--text); flex-shrink: 0; }
  .ticker-desc { font-size: 11px; color: var(--muted); width: 90px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ticker-bar-bg { flex: 1; height: 6px; background: var(--card2); border-radius: 3px; overflow: hidden; }
  .ticker-bar-fill-bull { height: 100%; background: var(--bull); border-radius: 3px; }
  .ticker-bar-fill-bear { height: 100%; background: var(--bear); border-radius: 3px; }
  .ticker-count { width: 24px; text-align: right; color: var(--muted); font-size: 11px; }

  /* ── Weekly Timeline ── */
  .week-item { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .week-item:last-child { border-bottom: none; }
  .week-badge { background: var(--card2); border-radius: 8px; padding: 6px 10px; text-align: center; flex-shrink: 0; min-width: 56px; }
  .week-badge .wnum { font-size: 18px; font-weight: 800; color: var(--accent2); line-height: 1; }
  .week-badge .wdate { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .week-content { flex: 1; min-width: 0; }
  .week-insight { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .week-meta { font-size: 11px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .week-bull-bear { font-size: 12px; color: var(--text); }

  /* ── Tabs ── */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tab { padding: 8px 16px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); transition: all .2s; }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── Loading ── */
  #loading { display: flex; align-items: center; justify-content: center; height: 60vh; flex-direction: column; gap: 12px; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Misc ── */
  .badge-change { background: rgba(245,158,11,0.15); color: var(--gold); padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; margin-left: 4px; }
  .empty-state { text-align: center; padding: 32px; color: var(--muted); font-size: 13px; }
  @media (max-width: 768px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } #kol-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <h1>KOL Research <span>Dashboard</span></h1>
  <span id="update-time">加载中...</span>
</header>

<div id="loading">
  <div class="spinner"></div>
  <div style="color:var(--muted);font-size:13px">正在加载数据...</div>
</div>

<div id="app" style="display:none">
<div class="container">

  <!-- 今日信号（置顶，加权评分驱动）-->
  <div id="today-signals" style="background:linear-gradient(135deg,rgba(34,197,94,0.10),rgba(59,130,246,0.06));border:1px solid rgba(34,197,94,0.28);border-radius:12px;padding:16px;margin-bottom:20px;display:none">
    <h3 style="font-size:14px;color:var(--bull);margin-bottom:6px;display:flex;align-items:center;gap:6px">🎯 今日信号 · 高价值新增观点</h3>
    <div id="today-signals-method" style="font-size:11px;color:var(--muted);margin-bottom:10px"></div>
    <div id="today-signals-list"></div>
  </div>

  <!-- Stance Change Banner -->
  <div id="stance-banner">
    <h3>⚡ 立场变化提醒</h3>
    <div id="stance-list"></div>
  </div>

  <!-- Top Row: Sector + Radar + Tickers -->
  <div class="grid-3" style="margin-bottom:20px">

    <!-- 板块情绪 -->
    <div class="card">
      <div class="card-title" id="sector-card-title">📊 板块情绪（近30天）</div>
      <div id="sector-bars"></div>
    </div>

    <!-- 雷达图 -->
    <div class="card">
      <div class="card-title">🔭 多空雷达</div>
      <div id="radar-wrap"><canvas id="radarChart"></canvas></div>
    </div>

    <!-- 标的热度 -->
    <div class="card">
      <div class="card-title" id="ticker-card-title">🔥 最热标的（近30天）</div>
      <div class="tabs" style="margin-bottom:10px">
        <div class="tab active" onclick="switchTickerTab('bull',this)">看多</div>
        <div class="tab" onclick="switchTickerTab('bear',this)">看空</div>
      </div>
      <div id="ticker-bull"></div>
      <div id="ticker-bear" style="display:none"></div>
    </div>
  </div>

  <!-- Global Filter Bar（所有 Tab 共用）-->
  <div class="filter-bar" style="margin-bottom:0;padding-bottom:14px;border-bottom:1px solid var(--border)">
    <input type="text" id="search-kol" placeholder="🔍 搜索 KOL、标的或关键词..." oninput="onFilterChange()">
    <select id="filter-days" onchange="onDaysChange()">
      <option value="7">最近 7 天</option>
      <option value="14">最近 14 天</option>
      <option value="30" selected>最近 30 天</option>
      <option value="60">最近 60 天</option>
      <option value="90">最近 90 天</option>
      <option value="0">全部时间</option>
      <option value="custom">自定义…</option>
    </select>
    <!-- 日期范围：始终可见；填写后覆盖上方快捷选项 -->
    <div id="custom-date-range" style="display:flex;align-items:center;gap:4px">
      <span style="font-size:12px;color:var(--muted);white-space:nowrap">📅 起</span>
      <input type="date" id="filter-from" onchange="onDateRangeChange()" style="background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:8px;font-size:12px;outline:none">
      <span style="color:var(--muted)">—</span>
      <span style="font-size:12px;color:var(--muted);white-space:nowrap">止</span>
      <input type="date" id="filter-to" onchange="onDateRangeChange()" style="background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:8px;font-size:12px;outline:none">
      <button onclick="clearDateRange()" title="清除日期范围" style="background:none;border:1px solid var(--border);color:var(--muted);padding:5px 8px;border-radius:6px;cursor:pointer;font-size:11px">✕</button>
    </div>
    <select id="filter-sector" onchange="onFilterChange()">
      <option value="">全部板块</option>
      <option>Precious Metals</option>
      <option>Macro</option>
      <option>Energy &amp; Commodities</option>
      <option>Crypto</option>
      <option>Equities</option>
      <option>Geopolitics</option>
      <option>Alternative</option>
      <option>AI &amp; Tech</option>
      <option>Technology</option>
      <option>Government Debt</option>
      <option>Mining &amp; Resources</option>
      <option>Multi-Asset</option>
    </select>
    <select id="filter-sentiment" onchange="onFilterChange()">
      <option value="">全部情绪</option>
      <option value="2">极度看多</option>
      <option value="1">看多</option>
      <option value="0">中性</option>
      <option value="-1">看空</option>
      <option value="-2">极度看空</option>
    </select>
    <select id="filter-type" onchange="onFilterChange()">
      <option value="">全部类型（仅KOL列表）</option>
      <option value="KOL">KOL</option>
      <option value="IB View">IB View</option>
      <option value="Prophet">Prophet</option>
      <option value="AI View">AI View</option>
    </select>
    <label style="font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px">
      <input type="checkbox" id="filter-changed" onchange="onFilterChange()"> 仅立场变化
    </label>
  </div>

  <!-- Main Content Tabs -->
  <div class="tabs" style="margin-top:16px">
    <div class="tab active" onclick="switchTab('kol',this)">KOL 列表</div>
    <div class="tab" onclick="switchTab('weekly',this)">周报历史</div>
  </div>

  <!-- KOL List Panel -->
  <div id="panel-kol" class="tab-panel active">
    <div id="kol-count" style="font-size:12px;color:var(--muted);margin-bottom:12px"></div>
    <div id="kol-grid"></div>
  </div>

  <!-- Weekly History Panel -->
  <div id="panel-weekly" class="tab-panel">
    <div id="weekly-list"></div>
  </div>

</div><!-- /container -->
</div><!-- /app -->

<script>
let DATA = null;
let changedKols = new Set();

// ── Sector normalization ──────────────────────────────────
// MECE 10-sector normalization（与 kol_sector_cleanup.py 保持同步）
const SECTOR_MAP = {
  // Energy & Commodities
  'Energy/Commodities':              'Energy & Commodities',
  'Energy/大宗':                     'Energy & Commodities',
  'Energy/Macro':                    'Energy & Commodities',
  'Energy':                          'Energy & Commodities',
  'Commodities':                     'Energy & Commodities',
  'Natural Resources':               'Energy & Commodities',
  'Basic Materials':                 'Energy & Commodities',
  // Macro
  'Macro/Tech':                      'Macro',
  'Multi-sector':                    'Macro',
  'Strategy':                        'Macro',
  'Information':                     'Macro',
  // AI & Tech
  'Tech/AI':                         'AI & Tech',
  'Tech/AI/Strategy':                'AI & Tech',
  'Technology':                      'AI & Tech',
  'Tech':                            'AI & Tech',
  // Crypto
  'Digital Assets':                  'Crypto',
  // Mining
  'Mining/Resources':                'Mining & Resources',
  'Mining Practical & Market Sniping': 'Mining & Resources',
  'Royalty Companies':               'Mining & Resources',
  // Alternative
  'Alternative Wealth':              'Alternative',
  'Alternative Wealth Transfer':     'Alternative',
  'Alternative/Prophecy':            'Alternative',
  '神学预言与另类财富转移':           'Alternative',
  'Theology/Alternative Wealth':     'Alternative',
  // Government
  'Government Data':                 'Government Debt',
  'Official Data':                   'Government Debt',
};
function normalizeSector(s) { return SECTOR_MAP[s] || s || ''; }

// ── Sector badge ──────────────────────────────────────────
const SECTOR_STYLE = {
  'Precious Metals':     { cls:'sb-pm',    icon:'🥇' },
  'Macro':               { cls:'sb-macro', icon:'📊' },
  'Energy & Commodities':{ cls:'sb-energy',icon:'⚡' },
  'Crypto':              { cls:'sb-crypto',icon:'₿'  },
  'Equities':            { cls:'sb-eq',    icon:'📈' },
  'Geopolitics':         { cls:'sb-geo',   icon:'🌐' },
  'Alternative':         { cls:'sb-alt',   icon:'🔮', label:'另类资产' },
  'AI & Tech':           { cls:'sb-ai',    icon:'🤖' },
  'Technology':          { cls:'sb-tech',  icon:'💻' },
  'Government Debt':     { cls:'sb-gov',   icon:'🏛️' },
  'Mining & Resources':  { cls:'sb-mine',  icon:'⛏️' },
  'Multi-Asset':         { cls:'sb-multi', icon:'🎯' },
};
function sectorBadge(sector) {
  const s = SECTOR_STYLE[sector] || { cls:'sb-alt', icon:'•' };
  const displayName = s.label || sector || '—';
  return `<span class="sector-badge ${s.cls}">${s.icon} ${displayName}</span>`;
}

// ── Sentiment scoring ─────────────────────────────────────
// Priority 1: bracket prefix in insight title "[看多]", "[看空]", "[中性]"
// Priority 2: bull_bear ticker field (🟢 / 🔴 count)
// Priority 3: keyword fallback in comments (conservative)
// Returns a score OR null (= no signal, exclude from average)
function sentimentScore(e) {
  const name = (e.name || '');
  // P1: explicit direction tag in title  → definitive signal
  if (/\[极度看多\]|\[极度看涨\]/.test(name)) return 2;
  if (/\[极度看空\]|\[极度看跌\]/.test(name)) return -2;
  if (/\[看多\]|\[看涨\]/.test(name)) return 1;
  if (/\[看空\]|\[看跌\]/.test(name)) return -1;
  if (/\[中性\]/.test(name)) return 0;
  // P2: bull_bear ticker balance (🟢 vs 🔴)
  const bb = e.bull_bear || '';
  const nBull = (bb.match(/🟢/g)||[]).length;
  const nBear = (bb.match(/🔴/g)||[]).length;
  if (nBull > nBear) return 1;
  if (nBear > nBull) return -1;
  // nBull === nBear but both > 0 → mixed signal, treat as null (not neutral)
  // no signal at all → null (exclude from weighted avg, don't drag to 0)
  return null;
}

const SCORE_LABEL = {2:'极度看多',1:'看多',0:'中性','-1':'看空','-2':'极度看空'};
function scoreLabel(s) { return SCORE_LABEL[String(Math.round(s))] || '中性'; }

// ── Recency-weighted average score ───────────────────────
// More recent entries have higher weight (half-life ≈ 21 days)
function weightedAvgScore(items) {
  if (!items.length) return null;
  const now = Date.now();
  let wSum = 0, wTotal = 0;
  items.forEach(e => {
    const score = sentimentScore(e);
    if (score === null) return;   // no signal → skip, don't drag average to 0
    const daysAgo = (now - new Date(e.date).getTime()) / 86400000;
    const w = Math.exp(-daysAgo / 21);
    wSum   += score * w;
    wTotal += w;
  });
  return wTotal > 0 ? +(wSum / wTotal).toFixed(2) : null;
}

function getCutoffDate(days) {
  if (!days || days == 0) return '2000-01-01';
  const d = new Date(); d.setDate(d.getDate() - days);
  return d.toISOString().slice(0,10);
}

// ── Load Data ──────────────────────────────────────────────
async function loadData() {
  try {
    const res = await fetch('data.json?t=' + Date.now());
    DATA = await res.json();
    document.getElementById('update-time').textContent = '更新于 ' + DATA.generated_at;
    render();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } catch(e) {
    document.getElementById('loading').innerHTML = '<div style="color:#ef4444">数据加载失败，请检查 data.json 是否存在</div>';
  }
}

// ── Date range helpers ────────────────────────────────────
// Date inputs are always visible. When filled, they override the preset dropdown.
function getActiveDateRange() {
  const fromVal = document.getElementById('filter-from').value;
  const toVal   = document.getElementById('filter-to').value;
  // If either date input is filled, use the custom range
  if (fromVal || toVal) {
    return { from: fromVal || '2000-01-01', to: toVal || '9999-12-31', isCustom: true };
  }
  // Otherwise use the preset dropdown
  const val  = document.getElementById('filter-days').value;
  const days = val === 'custom' ? 0 : parseInt(val);
  return { from: getCutoffDate(days), to: '9999-12-31', isCustom: false };
}

function getTimeLabel() {
  const r = getActiveDateRange();
  if (r.isCustom) {
    const f = document.getElementById('filter-from').value;
    const t = document.getElementById('filter-to').value;
    return `${f||'…'} ~ ${t||'…'}`;
  }
  const val = document.getElementById('filter-days').value;
  const days = parseInt(val);
  if (!days || days == 0) return '全部时间';
  return `近${days}天`;
}

// When date inputs change, switch dropdown to "custom" visually
function onDateRangeChange() {
  const f = document.getElementById('filter-from').value;
  const t = document.getElementById('filter-to').value;
  if (f || t) document.getElementById('filter-days').value = 'custom';
  onFilterChange();
}

function clearDateRange() {
  document.getElementById('filter-from').value = '';
  document.getElementById('filter-to').value   = '';
  document.getElementById('filter-days').value = '30';
  onFilterChange();
}

// Base entries: time + sector filtered (sector is normalized) — feeds ALL panels
function getBaseEntries() {
  const { from: fromDate, to: toDate } = getActiveDateRange();
  const sector = document.getElementById('filter-sector').value;
  let entries = (DATA.raw_entries || []).filter(e => {
    const d = e.date || '';
    return d >= fromDate && d <= toDate;
  });
  if (sector) entries = entries.filter(e => normalizeSector(e.sector) === sector);
  return entries.map(e => ({...e, sector: normalizeSector(e.sector)}));
}

function updateTitles() {
  const label = getTimeLabel();
  document.getElementById('sector-card-title').textContent = `📊 板块情绪（${label}）`;
  document.getElementById('ticker-card-title').textContent = `🔥 最热标的（${label}）`;
}

function onDaysChange() {
  // Clear date inputs when user picks a preset (not "custom")
  const val = document.getElementById('filter-days').value;
  if (val !== 'custom') {
    document.getElementById('filter-from').value = '';
    document.getElementById('filter-to').value   = '';
  }
  onFilterChange();
}

function render() {
  const entries = getBaseEntries();
  updateTitles();
  renderTodaySignals();
  renderStanceChanges(entries);
  renderSectorBars(entries);
  renderRadar(entries);
  renderTickerHeatmap(entries);
  applyFilters(entries);
  renderWeeklyList();
}

// ── 今日信号（读 data.json 的 today_signals + sector 加权评分）────
function renderTodaySignals() {
  const box = document.getElementById('today-signals');
  const sigs = DATA.today_signals || [];
  const sectors = (DATA.sector_summary || []).filter(s => typeof s.score === 'number' && (s.legs_total >= 3 || s.total >= 5));
  if (!sigs.length && !sectors.length) { box.style.display='none'; return; }
  box.style.display = 'block';
  if (DATA.scoring_method) document.getElementById('today-signals-method').textContent = '加权评分法：' + DATA.scoring_method;

  // 板块加权评分条（按 score 排序）
  let html = '<div style="margin-bottom:12px">';
  sectors.sort((a,b)=>b.score-a.score).forEach(s => {
    const pct = Math.abs(s.score)/2; // 0~50
    // 标签综合 score 与腿级真实多空(避免衰减后score偏中性但实际压倒性看空的情况)
    const lb = s.legs_bull!=null?s.legs_bull:s.bull, lbr = s.legs_bear!=null?s.legs_bear:s.bear;
    const tot = lb+lbr;
    const legBias = tot>=5 ? (lbr-lb)/tot : 0; // -1~1, 正=偏空
    const col = (s.score>15||legBias<-0.3) ? 'var(--bull)' : ((s.score<-15||legBias>0.3) ? 'var(--bear)' : 'var(--neutral)');
    const lbl = (s.score>15||legBias<-0.3) ? '偏多' : ((s.score<-15||legBias>0.3) ? '偏空' : '中性');
    html += `<div style="display:flex;align-items:center;gap:10px;padding:3px 0;font-size:12px">
      <span style="width:130px;color:var(--text)">${s.sector}</span>
      <span style="width:48px;text-align:right;font-weight:700;color:${col}">${s.score>0?'+':''}${s.score}</span>
      <span style="color:var(--muted);width:32px;font-size:11px">${lbl}</span>
      <div style="flex:1;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;position:relative">
        <div style="position:absolute;left:50%;top:0;height:100%;width:${pct}%;background:${col};border-radius:3px;${s.score<0?'transform:translateX(-100%)':''}"></div>
        <div style="position:absolute;left:50%;top:-2px;width:1px;height:10px;background:var(--muted)"></div>
      </div>
      <span style="color:var(--muted);width:160px;font-size:11px">多${s.legs_bull!=null?s.legs_bull:s.bull}${s.strong_bear>0?' <span style="color:var(--bear)">空'+s.legs_bear+'(强'+s.strong_bear+')</span>':' 空'+(s.legs_bear!=null?s.legs_bear:s.bear)}${s.legs_split>0?' 分歧'+s.legs_split:''}</span>
    </div>`;
  });
  html += '</div>';

  // 反转/高价值信号列表
  if (sigs.length) {
    html += '<div style="border-top:1px solid rgba(255,255,255,0.08);padding-top:10px">';
    sigs.forEach(sg => {
      const badge = sg.signal==='高' ? '<span style="background:var(--bull-bg);color:var(--bull);padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700">🔥高价值</span>' : '<span style="background:rgba(148,163,184,0.12);color:var(--neutral);padding:1px 6px;border-radius:4px;font-size:10px">中</span>';
      html += `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px">
        ${badge}
        <span style="color:var(--gold);font-size:11px">${sg.type}</span>
        <span style="font-weight:600;color:var(--text)">${sg.kol_name}</span>
        <span style="color:var(--muted);font-size:11px">${sg.sector||''} · ${sg.date}</span>
        <span style="color:var(--text);flex:1">${sg.desc||''}</span>
      </div>`;
    });
    html += '</div>';
  }
  document.getElementById('today-signals-list').innerHTML = html;
}

// ── Stance Changes ────────────────────────────────────────
function renderStanceChanges(entries) {
  changedKols.clear();
  // Compare last 7 days vs prior 7 days
  const today = new Date().toISOString().slice(0,10);
  const w0 = getCutoffDate(7), w1 = getCutoffDate(14);
  const byKol = {};
  entries.forEach(e => {
    const k = e.kol_name; if (!k) return;
    if (!byKol[k]) byKol[k] = {curr:[], prev:[]};
    if (e.date >= w0) byKol[k].curr.push(e);
    else if (e.date >= w1) byKol[k].prev.push(e);
  });
  const changes = [];
  Object.entries(byKol).forEach(([kol, w]) => {
    if (!w.curr.length || !w.prev.length) return;
    const cAvg = w.curr.reduce((a,e)=>a+sentimentScore(e),0)/w.curr.length;
    const pAvg = w.prev.reduce((a,e)=>a+sentimentScore(e),0)/w.prev.length;
    if ((pAvg > 0.3 && cAvg < -0.3) || (pAvg < -0.3 && cAvg > 0.3)) {
      changedKols.add(kol);
      changes.push({kol_name:kol, prev_score:pAvg, curr_score:cAvg,
        prev_label:scoreLabel(pAvg), curr_label:scoreLabel(cAvg),
        change_type: cAvg < 0 ? '转空':'转多',
        sector: w.curr[0].sector||''});
    }
  });

  const banner = document.getElementById('stance-banner');
  if (!changes.length) { banner.style.display='none'; return; }
  banner.style.display = 'block';
  document.getElementById('stance-list').innerHTML = changes.map(c => `
    <div class="stance-item">
      <span class="stance-kol">${c.kol_name}</span>
      <span class="tag-sector">${c.sector}</span>
      <span class="${c.prev_score>0?'tag-bull':c.prev_score<0?'tag-bear':'tag-neutral'}">${c.prev_label}</span>
      <span style="color:var(--gold)">→</span>
      <span class="${c.curr_score>0?'tag-bull':c.curr_score<0?'tag-bear':'tag-neutral'}">${c.curr_label}</span>
      <span style="margin-left:auto;color:var(--gold);font-weight:700;font-size:12px">${c.change_type} ⚡</span>
    </div>`).join('');
}

// ── Sector Bars (computed from raw entries) ───────────────
function renderSectorBars(entries) {
  const bySector = {};
  entries.forEach(e => {
    const s = e.sector; if (!s) return;
    if (!bySector[s]) bySector[s] = { scores: [], total: 0 };
    bySector[s].total++;
    const sc = sentimentScore(e);
    if (sc !== null) bySector[s].scores.push(sc);  // only track scored entries
  });

  const sectors = Object.entries(bySector).map(([s, d]) => {
    const scored = d.scores;
    const avg = scored.length > 0
      ? +(scored.reduce((a,b)=>a+b,0) / scored.length).toFixed(2)
      : null;
    return { sector: s, avg, total: d.total, scoredCount: scored.length };
  }).sort((a,b) => a.sector.localeCompare(b.sector));

  // Scale: ±2 is full half-width (100%)
  document.getElementById('sector-bars').innerHTML = sectors.map(s => {
    const v = s.avg;
    const hasData = v !== null;

    const halfPct = hasData ? Math.min(Math.abs(v) / 2 * 100, 100) : 0;
    const isNeutral = !hasData || Math.abs(v) <= 0.5;
    const barColor = isNeutral ? '#475569' : v > 0 ? '#22c55e' : '#ef4444';
    const scoreColor = isNeutral ? '#94a3b8' : v > 0 ? '#22c55e' : '#ef4444';
    const label = !hasData ? '—' : v > 0 ? `+${v}` : `${v}`;
    const title = !hasData ? '无情绪信号数据' : `有效信号 ${s.scoredCount}/${s.total} 条`;

    const bearPct = hasData && v < 0 ? halfPct : 0;
    const bullPct = hasData && v > 0 ? halfPct : 0;

    return `<div class="sector-row" title="${title}">
      <div class="sector-name">${s.sector}</div>
      <div class="sector-bar-wrap">
        <div class="sb-left"><div class="sb-fill" style="width:${bearPct}%;background:${barColor}"></div></div>
        <div class="sb-center-line"></div>
        <div class="sb-right"><div class="sb-fill" style="width:${bullPct}%;background:${barColor}"></div></div>
      </div>
      <div class="sector-score" style="color:${scoreColor}">${label}</div>
      <div class="sector-count">${s.total}条</div>
    </div>`;
  }).join('') || '<div class="empty-state">暂无数据</div>';
  return sectors;
}

// ── Radar Chart ───────────────────────────────────────────
let radarChart = null;
function renderRadar(entries) {
  const bySector = {};
  entries.forEach(e => {
    const s = e.sector; if (!s) return;
    if (!bySector[s]) bySector[s] = [];
    const sc = sentimentScore(e);
    if (sc !== null) bySector[s].push(sc);  // skip no-signal entries
  });
  const sectors = Object.entries(bySector)
    .filter(([,scores]) => scores.length > 0)
    .map(([s,scores]) => ({
      sector: s, avg: scores.reduce((a,b)=>a+b,0)/scores.length
    })).sort((a,b)=>a.sector.localeCompare(b.sector));
  if (!sectors.length) return;

  const labels = sectors.map(s => s.sector.replace(' & ','\n& '));
  const scores = sectors.map(s => s.avg + 2);
  if (radarChart) radarChart.destroy();
  radarChart = new Chart(document.getElementById('radarChart'), {
    type: 'radar',
    data: { labels, datasets: [{ label:'情绪', data:scores,
      backgroundColor:'rgba(99,102,241,0.15)', borderColor:'rgba(99,102,241,0.8)',
      pointBackgroundColor: scores.map(s=>s>2.3?'#22c55e':s<1.7?'#ef4444':'#94a3b8'),
      pointRadius:4, borderWidth:2 }] },
    options: { responsive:true, maintainAspectRatio:false,
      scales:{ r:{ min:0, max:4, ticks:{display:false},
        grid:{color:'rgba(255,255,255,0.07)'}, angleLines:{color:'rgba(255,255,255,0.07)'},
        pointLabels:{color:'#8892a4', font:{size:11}} }},
      plugins:{legend:{display:false}} }
  });
}

// ── Ticker Heatmap (computed from raw entries) ────────────
function renderTickerHeatmap(entries) {
  const ticker_re = /\b([A-Z]{2,5})\b/g;
  const bull = {}, bear = {};
  entries.forEach(e => {
    const bb = e.bull_bear || ''; if (!bb) return;
    if (bb.includes('🟢')) {
      const part = bb.split('🔴')[0].replace('🟢','');
      (part.match(ticker_re)||[]).forEach(t => { bull[t]=(bull[t]||0)+1; });
    }
    if (bb.includes('🔴')) {
      const part = bb.split('🔴').slice(1).join('');
      (part.match(ticker_re)||[]).forEach(t => { bear[t]=(bear[t]||0)+1; });
    }
  });
  const topBull = Object.entries(bull).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([t,c])=>({ticker:t,count:c}));
  const topBear = Object.entries(bear).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([t,c])=>({ticker:t,count:c}));

  function renderTickers(items, type) {
    if (!items.length) return '<div class="empty-state">暂无数据</div>';
    const max = items[0].count;
    return items.map(t=>`<div class="ticker-row">
      <div class="ticker-sym">${t.ticker}</div>
      <div class="ticker-desc" title="${tickerDesc(t.ticker)}">${tickerDesc(t.ticker)}</div>
      <div class="ticker-bar-bg"><div class="ticker-bar-fill-${type}" style="width:${t.count/max*100}%"></div></div>
      <div class="ticker-count">${t.count}</div>
    </div>`).join('');
  }
  document.getElementById('ticker-bull').innerHTML = renderTickers(topBull,'bull');
  document.getElementById('ticker-bear').innerHTML = renderTickers(topBear,'bear');
}

function switchTickerTab(type, el) {
  document.querySelectorAll('.card .tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('ticker-bull').style.display = type==='bull'?'block':'none';
  document.getElementById('ticker-bear').style.display = type==='bear'?'block':'none';
}

// ── KOL Cards (computed from raw entries) ─────────────────
function buildKolCards(entries) {
  const byKol = {};
  entries.forEach(e => {
    const k = e.kol_name; if (!k) return;
    if (!byKol[k]) byKol[k] = [];
    byKol[k].push(e);
  });
  return Object.entries(byKol).map(([kol, items]) => {
    items.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const latest = items[0];
    // Recency-weighted score (recent entries count more, half-life 21 days)
    const avg = weightedAvgScore(items);
    const w0 = getCutoffDate(7), w1 = getCutoffDate(14);
    const rItems = items.filter(e=>e.date>=w0);
    const oItems = items.filter(e=>e.date>=w1&&e.date<w0);
    let trend = 'stable';
    if (rItems.length && oItems.length) {
      const r = weightedAvgScore(rItems);
      const o = weightedAvgScore(oItems);
      trend = r-o>0.4?'rising':o-r>0.4?'falling':'stable';
    }
    return { kol_name:kol, sector:latest.sector||'', detail_sector:latest.detail_sector||'',
      kol_or_ib:latest.kol_or_ib||'KOL', latest_date:latest.date||'',
      latest_comments:(latest.comments||'').slice(0,200),
      latest_suggestion:(latest.suggestion||'').slice(0,150),
      latest_bull_bear:latest.bull_bear||'',
      avg_score:Math.round(avg*100)/100,
      score_label:scoreLabel(avg), trend, entry_count:items.length };
  }).sort((a,b)=>b.avg_score-a.avg_score);
}

function renderKolCards(cards) {
  if (!cards.length) {
    document.getElementById('kol-grid').innerHTML = '<div class="empty-state">没有符合条件的 KOL</div>';
    document.getElementById('kol-count').textContent = '';
    return;
  }
  document.getElementById('kol-count').textContent = `显示 ${cards.length} 位 KOL`;
  document.getElementById('kol-grid').innerHTML = cards.map(c => {
    const score = c.avg_score;
    const rounded = Math.round(score);
    const isChanged = changedKols.has(c.kol_name);
    // 修复：用 rounded（整数）决定颜色，避免 0.3→rounded=0 却被标成绿色的 bug
    const dots = [-2,-1,0,1,2].map(v => {
      let cls = 'dot';
      if (v === rounded) {
        cls += rounded > 0 ? ' active-bull' : rounded < 0 ? ' active-bear' : ' active-neutral';
      }
      return `<div class="${cls}"></div>`;
    }).join('');
    const sc = score>0.3?'var(--bull)':score<-0.3?'var(--bear)':'var(--neutral)';
    const ti = c.trend==='rising'?'<span class="trend-up">↑</span>':c.trend==='falling'?'<span class="trend-down">↓</span>':'';
    const changeTag = isChanged ? `<span class="badge-change">立场变化</span>` : '';
    return `<div class="kol-card${isChanged?' stance-changed':''}">
      <div class="kol-header">
        <div>
          <div class="kol-name">${c.kol_name}${changeTag}</div>
          <div class="kol-meta">
            ${sectorBadge(c.sector)}
            ${c.detail_sector?`<span style="color:var(--muted)">${c.detail_sector}</span>`:''}
            <span style="color:var(--border)">·</span>
            <span>${c.kol_or_ib}</span>
          </div>
        </div>
        <div class="sentiment-badge">
          <div class="sentiment-dots">${dots}</div>
          <div style="font-size:11px;color:${sc};font-weight:600">${c.score_label}</div>
        </div>
      </div>
      ${c.latest_bull_bear?`<div class="kol-bull-bear">${c.latest_bull_bear}</div>`:''}
      <div class="kol-comments">${c.latest_comments||'暂无摘要'}</div>
      <div class="kol-footer"><span>${c.latest_date}</span><span>${ti} ${c.entry_count}条记录</span></div>
    </div>`;
  }).join('');
}

// ── Filters (KOL cards only — sector already handled by getBaseEntries) ───
function applyFilters(baseEntries) {
  const entries     = baseEntries || getBaseEntries();
  const search      = document.getElementById('search-kol').value.toLowerCase();
  const sentiment   = document.getElementById('filter-sentiment').value;
  const type        = document.getElementById('filter-type').value;
  const onlyChanged = document.getElementById('filter-changed').checked;

  let cards = buildKolCards(entries);
  cards = cards.filter(c => {
    if (search && !c.kol_name.toLowerCase().includes(search) && !c.latest_bull_bear.toLowerCase().includes(search)) return false;
    if (sentiment !== '' && Math.round(c.avg_score) !== parseInt(sentiment)) return false;
    if (type && c.kol_or_ib !== type) return false;
    if (onlyChanged && !changedKols.has(c.kol_name)) return false;
    return true;
  });
  renderKolCards(cards);
}

// ── Weekly List ───────────────────────────────────────────
function renderWeeklyList() {
  const val     = document.getElementById('filter-days').value;
  const sector  = document.getElementById('filter-sector').value;
  const sentVal = document.getElementById('filter-sentiment').value;
  const search  = document.getElementById('search-kol').value.toLowerCase();

  const { from: fromDate, to: toDate } = getActiveDateRange();

  let weeks = DATA.weekly_reports || [];

  // Filter by time range
  weeks = weeks.filter(w => {
    const d = w.date || '';
    return d >= fromDate && d <= toDate;
  });

  // Filter by sector
  if (sector) weeks = weeks.filter(w => w.sector === sector);

  // Filter by sentiment (match against weekly insight keywords)
  if (sentVal !== '') {
    const sv = parseInt(sentVal);
    weeks = weeks.filter(w => {
      const txt = (w.key_insight||'') + ' ' + (w.bull_bear||'');
      if (sv ===  2) return /极度看多|极度看涨/.test(txt);
      if (sv ===  1) return /整体偏多|看多|看涨/.test(txt) && !/极度/.test(txt);
      if (sv ===  0) return /多空均衡|中性|分歧/.test(txt);
      if (sv === -1) return /整体偏空|看空|看跌/.test(txt) && !/极度/.test(txt);
      if (sv === -2) return /极度看空|极度看跌/.test(txt);
      return true;
    });
  }

  // Filter by search (key_insight, bull_bear, suggestion)
  if (search) {
    weeks = weeks.filter(w =>
      (w.key_insight||'').toLowerCase().includes(search) ||
      (w.bull_bear||'').toLowerCase().includes(search) ||
      (w.suggestion||'').toLowerCase().includes(search)
    );
  }

  if (!weeks.length) {
    document.getElementById('weekly-list').innerHTML =
      '<div class="empty-state">暂无周报 — 请运行 <code>python3 scripts/generate_weekly_report.py --backfill 8</code> 生成历史周报</div>';
    return;
  }

  document.getElementById('weekly-list').innerHTML = weeks.map(w => {
    const insight = w.key_insight || '';
    // Parse comments for sector sections (format: 【板块名】 content)
    const comments = w.comments || w.suggestion || '';
    const sectorBlocks = [];
    const sectorRe = /【([^】]+)】([^【]*)/g;
    let sm;
    while ((sm = sectorRe.exec(comments)) !== null) {
      sectorBlocks.push({ title: sm[1].trim(), body: sm[2].trim() });
    }
    const sectorsHtml = sectorBlocks.length > 0
      ? sectorBlocks.map(b => `
          <div style="margin-bottom:10px">
            <div style="font-size:11px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">${b.title}</div>
            <div style="font-size:12px;color:var(--muted);line-height:1.6">${b.body}</div>
          </div>`).join('')
      : `<div style="font-size:12px;color:var(--muted);line-height:1.6">${comments.slice(0,400)}${comments.length>400?'…':''}</div>`;

    // Suggestion
    const sugg = w.suggestion || '';
    const suggHtml = sugg
      ? `<div style="margin-top:10px;padding:8px 10px;background:rgba(99,102,241,0.08);border-radius:6px;border-left:3px solid var(--accent)">
           <div style="font-size:11px;color:var(--accent2);font-weight:700;margin-bottom:3px">💡 综合建议</div>
           <div style="font-size:12px;color:var(--muted);line-height:1.6">${sugg}</div>
         </div>` : '';

    // Bull/bear tickers
    const bb = w.bull_bear || '';
    const bbHtml = bb
      ? `<div class="week-bull-bear" style="margin-top:8px">${bb}</div>` : '';

    return `<div class="week-item">
      <div class="week-badge">
        <div class="wnum">W${w.week_number||''}</div>
        <div class="wdate">${w.date||''}</div>
      </div>
      <div class="week-content" style="flex:1">
        <div class="week-insight" style="margin-bottom:10px">${insight}</div>
        <div>${sectorsHtml}</div>
        ${suggHtml}
        ${bbHtml}
      </div>
    </div>`;
  }).join('');
}

// ── onFilterChange（全局 filter bar 统一入口）────────────────
function onFilterChange() {
  render();
}

// ── Tab Switch ────────────────────────────────────────────
function switchTab(panel, el) {
  document.querySelectorAll('.tabs:not(.card .tabs) .tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-kol').classList.remove('active');
  document.getElementById('panel-weekly').classList.remove('active');
  document.getElementById('panel-' + panel).classList.add('active');
  if (panel === 'weekly') renderWeeklyList();
}

loadData();
</script>
